name: CI

on:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
        include:
          # macOS: one modern Python is enough — first macOS CI coverage for the
          # experimental macOS support, and exercises the real security(1) Keychain
          # integration test.
          - os: macos-latest
            python-version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
          python -m pip install pytest

      - name: Compile
        run: python -m compileall -q src/tokdash main.py docs/guides/agents/openclaw_reporting/openclaw_cron_job.py

      - name: Test
        run: pytest -q

      # Every winsched unit test fakes `schtasks`; this is the only place the rendered
      # task XML meets the real Task Scheduler. Added after `tokdash setup` failed on a
      # native-Windows host: the file was written UTF-8, and `schtasks /Create /XML`
      # (MSXML) refuses a UTF-8 declaration it is handed as UTF-16 — a green pytest run
      # could never have caught that. Both rendered variants are registered: the
      # env_data_dir one carries a -c trampoline whose <Arguments> is list2cmdline
      # quoting on top of XML escaping — the fragility the plain variant never
      # exercises. See docs/local/20260819_windows_compat_review/REVIEW.md (P0).
      - name: schtasks smoke — register the rendered task for real
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "tokdash-schtasks-check"
          $py = @'
          import pathlib, sys
          from tokdash.onboard import winsched, paths
          tmp = pathlib.Path(sys.argv[1])
          variant = sys.argv[2]
          tmp.mkdir(parents=True, exist_ok=True)
          out = tmp / (variant + ".xml")
          paths.winsched_task_path = lambda: out
          kwargs = {}
          if variant == "env":
              kwargs["env_data_dir"] = str(tmp / "custom-dd")
          winsched.write_task(winsched.render_task(
              [sys.executable, "-m", "tokdash"], "127.0.0.1", 55423,
              marker_id="ci-encoding-check", **kwargs))
          print(str(out))
          '@
          $xml = & python -c $py $tmp default
          if ($LASTEXITCODE -ne 0) {
            throw "rendering the default task variant failed with exit $LASTEXITCODE (check the python output above)"
          }
          $xmlEnv = & python -c $py $tmp env
          if ($LASTEXITCODE -ne 0) {
            throw "rendering the env_data_dir task variant failed with exit $LASTEXITCODE (check the python output above)"
          }
          $task = "Tokdash-CI-XML-Check"
          $taskEnv = "Tokdash-CI-XML-Check-Env"
          try {
            schtasks.exe /Create /TN $task /XML $xml /F
            if ($LASTEXITCODE -ne 0) {
              throw "schtasks /Create /XML failed with exit ${LASTEXITCODE}: Task Scheduler rejects the rendered definition"
            }
            schtasks.exe /Create /TN $taskEnv /XML $xmlEnv /F
            if ($LASTEXITCODE -ne 0) {
              throw "schtasks /Create /XML failed with exit ${LASTEXITCODE}: Task Scheduler rejects the env_data_dir variant"
            }
          } finally {
            schtasks.exe /Delete /TN $task /F 2>$null | Out-Null
            schtasks.exe /Delete /TN $taskEnv /F 2>$null | Out-Null
          }
