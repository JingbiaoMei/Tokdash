name: Companion release guard

on:
  push:
    tags:
      - "companion-v*"

permissions:
  contents: read

concurrency:
  group: companion-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  block-unconfigured-signing:
    name: Refuse unsigned public release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and tag
        run: python3 companion/scripts/check_release.py --tag "$GITHUB_REF_NAME"

      - name: Require the tagged commit on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Companion release tags must point to a commit already on main." >&2
            exit 1
          }

      - name: Block release until signing is configured
        run: |
          echo "::error::No unsigned companion release is permitted."
          echo "::error::Configure Developer ID notarization and a trusted Windows signing provider before replacing this guard."
          exit 1

# This guard deliberately has no write, OIDC, attestation, artifact-upload, or
# release permissions. Replace it with the reviewed signed-release workflow only
# after both platform signing identities and protected environments are ready.
