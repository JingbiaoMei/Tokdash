name: TokdashCompanion
options:
  bundleIdPrefix: com.tokdash
  xcodeVersion: "15.4"
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.tokdash.companion
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "2"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: TokdashCompanion/Info.plist
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_HARDENED_RUNTIME: YES

targets:
  TokdashCompanion:
    type: application
    platform: macOS
    sources:
      - path: TokdashCompanion
        excludes:
          - "Info.plist"
    resources:
      - path: TokdashCompanion/Assets.xcassets
    info:
      path: TokdashCompanion/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
    settings:
      base:
        PRODUCT_NAME: TokdashCompanion

  TokdashCompanionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TokdashCompanionTests
    dependencies:
      - target: TokdashCompanion
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TokdashCompanion.app/Contents/MacOS/TokdashCompanion
