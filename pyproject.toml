[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokdash"
version = "2.6.3"
description = "Local token & cost dashboard for AI coding tools"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Jingbiao Mei" },
]
keywords = ["token", "cost", "dashboard", "llm", "ai", "codex", "claude", "gemini", "antigravity", "kimi"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  # PEP 440-correct version comparison for the opt-in update check (updatecheck.py); the
  # hand-rolled fallback is only correct for plain X.Y.Z releases, not pre/post/dev.
  "packaging>=21.0",
  # DeepSeek Harness session logs are concatenated zstd frames (sources/dsh_log.py).
  "zstandard>=0.23",
  # Terminal dashboard (`tokdash tui`). Textual 8.x's worker/seam API is what
  # src/tokdash/tui/app.py is written against, and every 8.x verified fact in
  # the code (no on_*_success delivery, thread=True required, no column justify)
  # is a Textual-8 fact — so an unpinned future major (9+) could break the TUI
  # on an upgrade with no signal. Capped until a major is explicitly adopted.
  "textual>=8.0.0,<9",
]

[project.urls]
Homepage = "https://github.com/JingbiaoMei/tokdash"
Repository = "https://github.com/JingbiaoMei/tokdash"
Issues = "https://github.com/JingbiaoMei/tokdash/issues"
Changelog = "https://github.com/JingbiaoMei/tokdash/blob/main/docs/development/CHANGELOG.md"

[project.scripts]
tokdash = "tokdash.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
tokdash = [
  "pricing_db.json",
  "static/*",
  "static/**/*",
]

[tool.pytest.ini_options]
# Keep only failed tests' tmp dirs (dead per-test Chrome profiles used to
# accumulate gigabytes under /tmp/pytest-of-<user>).
tmp_path_retention_policy = "failed"
markers = [
    "opens_browser: test legitimately exercises a browser-open sink; the no_browser_open backstop is suspended for it",
]
